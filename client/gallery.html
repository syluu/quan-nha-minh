<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bộ sưu tập mô hình (dev)</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3efe4; color: #2b2118; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 16px; }
    figure { margin: 0; background: #fffaf0; border: 1px solid #d9cbb0; border-radius: 10px; padding: 8px; text-align: center; }
    figure img { width: 100%; border-radius: 6px; background: linear-gradient(#fdf6e8, #e9dcc0); }
    figcaption { font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>
  <main id="grid"></main>
  <script type="module" src="/src/gallery.ts"></script>
</body>
</html>
