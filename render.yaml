# Render Blueprint — 1 web service chạy cả game (client đã build + server chơi chung).
services:
  - type: web
    name: quan-nha-minh
    runtime: node
    region: singapore
    plan: free
    # Build chỉ cần các gói trong "dependencies" (Vite, tsx…) nên chạy được cả khi NODE_ENV=production.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
